name: Scrape Products

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at 00:00 UTC
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install Playwright
        timeout-minutes: 5
        run: npm ci && npx playwright install chromium
      
      - name: Run scraper
        timeout-minutes: 5
        run: npm run scrape
      
      - name: Commit products.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'scraper/products.json web/public/data/products.json'
          commit_message: "Update products.json - scraped from gakits.com"
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}